<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071014"><title>Свобода от никотина</title><style>
:root{--bg:#071014;--card:#101e23;--line:#26373a;--gold:#f5c66a;--green:#56dd8b;--muted:#a1afb2;--red:#ff7075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f3eb;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}main{max-width:520px;margin:auto;min-height:100dvh;padding:22px 18px 105px;background:radial-gradient(ellipse at 80% -5%,#263e3e 0,transparent 38%),var(--bg)}h1{font:30px Georgia,serif;margin:8px 0 4px}h2{font-size:21px;margin:8px 0 16px}h3{font-size:16px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.brand{color:var(--gold);letter-spacing:1px;font:18px Georgia,serif}.hero{padding:28px 20px;border:1px solid #7a6139;border-radius:24px;background:linear-gradient(145deg,#1b3236,#0b1519 75%);text-align:center;margin:20px 0}.hero .big{font-size:68px;font-weight:800;color:var(--gold);line-height:1.1}.card{border:1px solid var(--line);background:linear-gradient(150deg,#14262a,#0d181c);border-radius:18px;padding:17px;margin:12px 0}.gold{color:var(--gold)}.green{color:var(--green)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:25px;font-weight:800;margin-top:5px}.btn{border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(110deg,#ffe098,#dfa33f);color:#1c170e;font-weight:750;width:100%;margin:7px 0}.btn.secondary{background:#1b2b30;color:#f6f3eb;border:1px solid #3b4b4c}.btn.danger{background:#46242a;color:#ffb4b6}.smallbtn{border:1px solid #425055;background:#18292e;color:#fff;border-radius:12px;padding:10px 13px}.field{display:block;color:#cbd5d2;font-size:13px;margin:14px 0 5px}input,textarea{width:100%;padding:13px;border-radius:12px;background:#0b171b;border:1px solid #3b4a4d;color:#fff;outline:none}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{border-color:var(--gold)}.avatar{width:68px;height:68px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:#243638}.avatar.bigavatar{width:112px;height:112px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#091318ee;border-top:1px solid #334044;display:flex;justify-content:center;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(12px)}.tabs>div{display:flex;width:min(520px,100%)}.tab{flex:1;background:none;border:0;color:#a6b4b5;font-size:11px;padding:5px 0}.tab span{display:block;font-size:21px;margin-bottom:3px}.tab.active{color:var(--gold)}.hidden{display:none!important}.pill{border-radius:100px;background:#203338;color:#dce4df;padding:7px 11px;font-size:12px;display:inline-block;margin:4px}.log{padding:12px 0;border-bottom:1px solid #2d3d3f}.log:last-child{border:0}.bar{height:11px;background:#2b393b;border-radius:12px;overflow:hidden;margin:7px 0}.bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}.modal{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:min(440px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(150deg,#253334,#0c1518);border:1px solid #876a3e;border-radius:24px;padding:22px;text-align:center;box-shadow:0 25px 70px #000b}.notice{font-size:12px;color:#a6b4b5;line-height:1.5}.circle{width:190px;height:190px;border-radius:50%;border:12px solid #223632;border-top-color:var(--green);border-right-color:var(--gold);margin:20px auto;display:grid;place-content:center}.circle strong{font-size:64px}.circle span{font-size:12px}.quote{font:22px/1.4 Georgia,serif;color:#f6d393}.top{display:flex;align-items:center;justify-content:space-between}.chart{display:flex;align-items:end;gap:7px;height:160px;border-bottom:1px solid #566;padding-top:20px}.chart>div{flex:1;min-width:0;text-align:center}.chart i{display:block;background:linear-gradient(var(--gold),#b6792b);border-radius:5px 5px 0 0;min-height:3px}.chart small{display:block;color:#a8b4b3;font-size:10px;padding-top:5px}.chip{padding:8px 10px;border:1px solid #435053;border-radius:12px;display:inline-block;margin:3px}.chip.on{background:#5b4829;border-color:var(--gold)}.photochoose{display:flex;align-items:center;gap:12px}.divider{height:1px;background:#2b3c3e;margin:17px 0}a{color:var(--gold)}
</style></head><body><main id="app"></main><nav class="tabs hidden" id="nav"><div><button class="tab" data-page="home"><span>⌂</span>Главная</button><button class="tab" data-page="diary"><span>▤</span>Дневник</button><button class="tab" data-page="help"><span>♡</span>Помощь</button><button class="tab" data-page="stats"><span>▥</span>Статистика</button><button class="tab" data-page="profile"><span>♙</span>Профиль</button></div></nav><div id="modal" class="modal hidden"></div><script>
const KEY='nicotine_free_v2';const today=()=>new Date().toLocaleDateString('sv-SE');const dateTime=()=>new Date().toISOString();const initial={created:dateTime(),name:'',age:'',photo:'',quitDate:today(),baseline:20,price:0,logs:[],cravings:[],notes:[],lastPromoCycle:0};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}};let page=data.name?'home':'setup';let helpTopic='';const app=document.getElementById('app'),nav=document.getElementById('nav'),modal=document.getElementById('modal');const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});const dayIndex=s=>Math.floor((new Date(today()+'T12:00:00')-new Date(s+'T12:00:00'))/86400000);const count=s=>data.logs.filter(x=>x.date===s).reduce((a,x)=>a+x.qty,0);const total=()=>data.logs.reduce((a,x)=>a+x.qty,0);const days=()=>Math.max(0,dayIndex(data.quitDate));const daysFree=()=>{let n=0;for(let i=0;i<=days();i++){let d=new Date(data.quitDate+'T12:00:00');d.setDate(d.getDate()+i);if(d>new Date())break;if(count(d.toLocaleDateString('sv-SE'))===0)n++}return n};const savedSticks=()=>Math.max(0,daysFree()*Number(data.baseline||0));const money=()=>Math.round(savedSticks()*Number(data.price||0));function go(p){page=p;render();window.scrollTo(0,0)}function header(title){return `<div class="top"><div class="brand">❧ Свобода от никотина</div><button class="smallbtn" onclick="go('profile')">⚙</button></div><h2>${title}</h2>`}function render(){nav.classList.toggle('hidden',page==='setup');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='setup')html=`<div class="brand" style="text-align:center;margin-top:24px">❧ СВОБОДА ОТ НИКОТИНА</div><div class="hero"><div style="font-size:52px">🏔️</div><h1>Твой путь к свободе</h1><p class="muted">Меньше никотина. Больше жизни.</p></div><h2>Расскажи о себе</h2><div class="card"><div class="photochoose"><img class="avatar bigavatar" id="preview" src="${data.photo||''}" alt="Фото"><div><strong>Твоё фото</strong><p class="muted">По желанию, хранится только на устройстве</p><input type="file" id="photo" accept="image/*" style="width:100%"></div></div><label class="field">Имя</label><input id="name" maxlength="40" placeholder="Как тебя зовут?" value="${esc(data.name)}"><label class="field">Возраст</label><input id="age" type="number" min="13" max="110" placeholder="Например, 32" value="${esc(data.age)}"><label class="field">Дата начала отказа</label><input id="quit" type="date" value="${data.quitDate}"><label class="field">Обычно стиков в день</label><input id="baseline" type="number" min="0" max="200" value="${data.baseline}"><label class="field">Цена одного стика (₽, необязательно)</label><input id="price" type="number" min="0" step="0.01" value="${data.price}"><button class="btn" onclick="setupDone()">Начать мой путь →</button></div>`;
if(page==='home')html=`<div class="top"><div class="brand">❧ Свобода от никотина</div><img class="avatar" onclick="go('profile')" src="${data.photo||''}" alt="Профиль"></div><h1>Привет, ${esc(data.name)}!</h1><p class="muted">Каждый шаг имеет значение</p><div class="circle"><span>Без стиков сегодня</span><strong>${count(today())===0?'✓':count(today())}</strong><span>${count(today())===0?'Продолжай!':'стиков сегодня'}</span></div><div class="grid"><div class="card"><div class="muted">Дней с начала</div><div class="metric gold">${days()+1}</div></div><div class="card"><div class="muted">Стиков сегодня</div><div class="metric">${count(today())}</div></div><div class="card"><div class="muted">Дней без стиков</div><div class="metric green">${daysFree()}</div></div><div class="card"><div class="muted">Не выкурено (оценка)</div><div class="metric">${savedSticks()}</div></div></div><button class="btn" onclick="addStick()">+ Я выкурил 1 стик</button><button class="btn secondary" onclick="go('help')">Меня тянет курить — нужна помощь</button><div class="card"><div class="quote">«Свобода начинается с одного решения, которое ты повторяешь каждый день»</div></div><div class="card"><h3>Сегодняшняя цель</h3><p class="muted">Сокращай употребление в своём темпе. Если случился срыв — продолжай путь.</p><button class="smallbtn" onclick="go('diary')">Открыть дневник →</button></div>`;
if(page==='diary'){let entries=[...data.logs.filter(x=>x.date===today()).map(x=>({t:x.at,desc:`🚬 ${x.qty} стик(ов)`})),...data.cravings.filter(x=>x.date===today()).map(x=>({t:x.at,desc:`⚡ Тяга: ${x.level}/10`})),...data.notes.filter(x=>x.date===today()).map(x=>({t:x.at,desc:`📝 ${esc(x.text)}`}))].sort((a,b)=>b.t.localeCompare(a.t));html=header('Дневник')+`<div class="card"><h3>${fmtDate(today())}</h3><p class="muted">Сегодня выкурено: <b class="gold">${count(today())}</b> стиков</p><button class="btn" onclick="addStick()">+ Добавить стик</button><button class="btn secondary" onclick="craving()">⚡ Записать тягу</button><label class="field">Заметка дня</label><textarea id="note" placeholder="Что сегодня помогло тебе? Как ты себя чувствуешь?"></textarea><button class="smallbtn" onclick="addNote()">Сохранить заметку</button></div><div class="card"><h3>Записи за сегодня</h3>${entries.length?entries.map(x=>`<div class="log"><span class="muted">${new Date(x.t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span> ${x.desc}</div>`).join(''):'<p class="muted">Пока нет записей</p>'}</div><div class="card"><h3>Последние 7 дней</h3>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-i);let s=d.toLocaleDateString('sv-SE');return `<div class="log row"><span>${fmtDate(s)}</span><b>${count(s)} стиков</b></div>`}).join('')}</div>`}
if(page==='help')html=header('Когда тянет курить')+`<p class="muted">Тяга обычно проходит волнами. Выбери действие на ближайшие минуты.</p>${[['🌬️','Дыхание 4–6','Вдыхай 4 секунды, выдыхай 6 секунд. Повтори 10 раз.'],['🚶','Движение','Пройдись 5 минут или сделай лёгкую разминку.'],['💧','Вода и пауза','Выпей воды и отложи решение на 10 минут.'],['🧠','Напомни себе зачем','Вспомни главную причину, по которой ты решил бросить.'],['📞','Поддержка','Напиши человеку, которому доверяешь.']].map(x=>`<div class="card" onclick="showHelp('${x[1]}','${x[2]}')"><div class="row"><b>${x[0]} ${x[1]}</b><span class="gold">›</span></div></div>`).join('')}<button class="btn" onclick="craving()">Отметить силу тяги</button><div class="card"><h3>Если тяжело справляться</h3><p class="muted">При выраженной зависимости помогают поведенческая поддержка и лекарства для отказа от никотина. Обсуди подходящий вариант с врачом или фармацевтом.</p></div>`;
if(page==='stats'){let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return d.toLocaleDateString('sv-SE')});let max=Math.max(1,...dates.map(count));html=header('Статистика')+`<div class="grid"><div class="card"><div class="muted">Дней без стиков</div><div class="metric green">${daysFree()}</div></div><div class="card"><div class="muted">Всего записано</div><div class="metric">${total()}</div></div><div class="card"><div class="muted">Не выкурено*</div><div class="metric gold">${savedSticks()}</div></div><div class="card"><div class="muted">Экономия*</div><div class="metric">${money()} ₽</div></div></div><div class="card"><h3>Стики за последние 7 дней</h3><div class="chart">${dates.map(d=>`<div><i style="height:${Math.max(3,count(d)/max*115)}px"></i><small>${d.slice(8)}</small></div>`).join('')}</div></div><div class="card"><h3>Достижения</h3>${[1,3,7,14,30,60,100].map(n=>`<div class="log row"><span>${daysFree()>=n?'🏅':'🔒'} ${n} ${n===1?'день':'дней'} без стиков</span><span class="${daysFree()>=n?'green':'muted'}">${daysFree()>=n?'Получено':`${Math.min(daysFree(),n)}/${n}`}</span></div>`).join('')}</div><p class="notice">* Приблизительная оценка относительно привычного количества стиков. Дни без стиков определяются по записям в дневнике; отсутствие записи не доказывает отказ.</p>`}
if(page==='profile')html=header('Мой профиль')+`<div class="card" style="text-align:center"><img class="avatar bigavatar" src="${data.photo||''}" alt="Фото"><h1>${esc(data.name)}</h1><p class="muted">${data.age?esc(data.age)+' лет · ':''}Начало: ${fmtDate(data.quitDate)}</p></div><div class="card"><h3>Изменить данные</h3><label class="field">Имя</label><input id="name" maxlength="40" value="${esc(data.name)}"><label class="field">Возраст</label><input id="age" type="number" min="13" max="110" value="${esc(data.age)}"><label class="field">Новое фото</label><input type="file" id="photo" accept="image/*"><label class="field">Дата начала</label><input id="quit" type="date" value="${data.quitDate}"><label class="field">Стиков в день до начала</label><input id="baseline" type="number" min="0" max="200" value="${data.baseline}"><label class="field">Цена стика в рублях</label><input id="price" type="number" min="0" step="0.01" value="${data.price}"><button class="btn" onclick="saveProfile()">Сохранить профиль</button></div><div class="card"><h3>Instagram автора</h3><p class="muted">Добровольная подписка. Приложение работает без неё.</p><button class="btn secondary" onclick="promo(true)">Посмотреть Instagram</button></div><div class="card"><h3>Данные</h3><button class="btn secondary" onclick="exportData()">Экспортировать данные JSON</button><button class="btn danger" onclick="resetData()">Удалить все мои данные</button><p class="notice">Данные хранятся локально в браузере. При очистке данных браузера они могут исчезнуть.</p></div>`;
app.innerHTML=html;nav.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.page));if(page==='setup'||page==='profile'){document.getElementById('photo').onchange=photoChange}save()}
async function photoChange(e){const f=e.target.files?.[0];if(!f)return;if(f.size>8e6){alert('Выбери фото размером до 8 МБ');return}const img=new Image();const reader=new FileReader();reader.onload=()=>{img.onload=()=>{const c=document.createElement('canvas'),m=320,scale=Math.min(1,m/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);data.photo=c.toDataURL('image/jpeg',.78);try{save()}catch{alert('Не удалось сохранить фото. Попробуй другое.')}let p=document.getElementById('preview');if(p)p.src=data.photo};img.src=reader.result};reader.readAsDataURL(f)}function updateFields(){let name=document.getElementById('name').value.trim(),age=document.getElementById('age').value,quit=document.getElementById('quit').value,base=Number(document.getElementById('baseline').value),price=Number(document.getElementById('price').value);if(!name){alert('Введи имя');return false}if(age&&(+age<13||+age>110)){alert('Проверь возраст');return false}if(!quit||dayIndex(quit)<0){alert('Дата начала не может быть в будущем');return false}if(base<0||base>200||price<0){alert('Проверь количество и стоимость стиков');return false}Object.assign(data,{name,age,quitDate:quit,baseline:base,price});save();return true}function setupDone(){if(updateFields()){go('home');maybePromo()}}function saveProfile(){if(updateFields()){alert('Профиль сохранён');go('home')}}function addStick(){data.logs.push({date:today(),at:dateTime(),qty:1});save();render()}function craving(){modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><h2>Сила тяги сейчас</h2><p class="muted">Оцени от 1 до 10</p><input id="level" type="range" min="1" max="10" value="5" oninput="document.getElementById('val').textContent=this.value"><div class="metric gold" id="val">5</div><button class="btn" onclick="recordCraving()">Сохранить</button><button class="btn secondary" onclick="closeModal()">Отмена</button></div>`}function recordCraving(){data.cravings.push({date:today(),at:dateTime(),level:+document.getElementById('level').value});save();closeModal();render()}function addNote(){let t=document.getElementById('note').value.trim();if(!t)return;data.notes.push({date:today(),at:dateTime(),text:t.slice(0,1000)});save();render()}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}function showHelp(title,description){modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><h2>${title}</h2><p>${description}</p><button class="btn" onclick="closeModal()">Я справлюсь</button></div>`}const insta='https://www.instagram.com/pavlovdmutruu/';function promo(manual=false){modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><div style="font-size:45px">📸</div><h1 class="gold">5 дней — новый шаг!</h1><p>Хочешь больше мотивации и полезных советов?</p><div class="card"><strong>@pavlovdmutruu</strong><p class="muted">Instagram автора приложения</p></div><button class="btn" onclick="window.open('${insta}','_blank','noopener');closeModal()">Подписаться в Instagram ↗</button><button class="btn secondary" onclick="closeModal()">Продолжить без подписки</button><p class="notice">Подписка необязательна. Предложение повторяется каждые 5 дней. Проверка подписки не выполняется.</p></div>`}function maybePromo(){const elapsed=Math.max(0,Math.floor((Date.now()-new Date(data.created).getTime())/86400000));const cycle=Math.floor(elapsed/5);if(cycle>0&&cycle>data.lastPromoCycle){data.lastPromoCycle=cycle;save();promo()}}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nicotine-free-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function resetData(){if(confirm('Удалить профиль и все записи без возможности восстановления?')){localStorage.removeItem(KEY);data={...initial,created:dateTime()};go('setup')}}render();if(page!=='setup')maybePromo();
</script></body></html>
